# Protocolo original (o proxy do Easypanel termina o HTTPS e repassa em HTTP)
map $http_x_forwarded_proto $proto_original {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  # ── Rotas do app (React). Vêm antes da regra das landing pages ──
  location ^~ /app             { try_files $uri /index.html; }
  location ^~ /assets/         { try_files $uri =404; expires 30d; add_header Cache-Control "public, immutable"; }
  location = /                 { try_files /index.html =404; }
  location = /landing          { try_files /index.html =404; }
  location = /login            { try_files /index.html =404; }
  location = /register         { try_files /index.html =404; }
  location = /forgot-password  { try_files /index.html =404; }
  location = /reset-password   { try_files /index.html =404; }
  location = /confirmar-email  { try_files /index.html =404; }

  # ── API ──
  location /api/ {
    # Padrão do nginx é 1 MB; o upload da foto da página dos grupos chega em base64
    client_max_body_size 6m;
    proxy_pass http://ofertarelay-api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $proto_original;
  }

  # ── Página de grupos do usuário: ofertarelay.com.br/capivaraofertas ──
  # Qualquer caminho de um nível só (letras minúsculas, números e hífen) vira landing page,
  # renderizada pela API (carrega rápido e gera prévia com foto no WhatsApp/Instagram).
  location ~ "^/([a-z0-9-]{3,40})/?$" {
    rewrite "^/([a-z0-9-]{3,40})/?$" /api/v1/public/p/$1 break;
    proxy_pass http://ofertarelay-api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $proto_original;
  }

  # Demais caminhos (arquivos estáticos, rotas antigas)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
